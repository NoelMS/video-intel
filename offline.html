<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Video Intelligence · not running</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #121211; color: #ebe6da; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 34rem; padding: 24px; }
    main > svg { display: block; margin-bottom: 24px; }
    p.k { font: 600 13px/1.4 system-ui, sans-serif; color: #d8905e; margin: 0 0 10px; }
    h1 { font-size: 32px; line-height: 1.1; letter-spacing: -.02em; margin: 0 0 14px; }
    p { color: #b3ad9f; margin: 0 0 12px; }
    code { color: #e0a84f; }
    p.s { margin-top: 16px; font-size: 14px; color: #e0a84f; min-height: 1.5em; }
    button { margin-top: 12px; font: 700 12px/1 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; padding: 10px 16px; background: #ebe6da; color: #121211; border: 0; border-radius: 2px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <svg width="56" height="56" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">  <rect width="512" height="512" rx="104" fill="#121211"/>  <g fill="none" stroke="#e0a84f" stroke-width="22" stroke-linecap="square">    <path d="M136 196V136h60M316 136h60v60M376 316v60h-60M196 376h-60v-60"/>  </g>  <rect x="226" y="226" width="60" height="60" fill="#ebe6da" transform="rotate(45 256 256)"/></svg>
    <p class="k">Server not running</p>
    <h1>Starting the local server…</h1>
    <p>This app runs on your own computer. If your browser asks to open the <b>Video Intelligence launcher</b>, allow it and tick “Always allow” so it starts silently next time.</p>
    <button id="go">Start the server</button>
    <p id="status" class="s"></p>
  </main>
  <script>
    const status = document.getElementById('status');
    const up = () => fetch('/api/health', { cache: 'no-store' }).then(r => r.ok, () => false);
    const wait = ms => new Promise(r => setTimeout(r, ms));
    async function start() {
      location.href = 'video-intel://start';   // registered by Video Intelligence.exe; runs it with --background
      status.textContent = 'Starting…';
      for (let i = 0; i < 40; i++) { await wait(750); if (await up()) return location.reload(); }
      status.textContent = 'Still not running. On first use on this computer, open Video Intelligence.exe in the video-intel folder once; it sets this button up.';
    }
    document.getElementById('go').onclick = start;
    start();                                                                // may be blocked without a click; the button covers that
    (async () => { for (;;) { await wait(2000); if (await up()) return location.reload(); } })();  // started some other way
  </script>
</body>
</html>
